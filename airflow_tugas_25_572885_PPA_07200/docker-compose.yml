# Airflow lokal untuk tugas (Windows + Docker Desktop).
# Bukan setup produksi. Login UI: admin / admin

services:
  airflow:
    build: .
    image: airflow-tugas-fmcg:2.10.5
    container_name: airflow_tugas_25572885
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./docs:/opt/airflow/docs
      - ./logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - |
          airflow db init
          airflow users create --username admin --password admin --firstname Admin --lastname Mahasiswa --role Admin --email admin@example.com || true
          airflow scheduler &
          exec airflow webserver --port 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
